name: Playwright end-to-end

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: J-cars-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: J-cars-app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}
      - name: Start isolated Supabase
        run: supabase start
      - name: Configure local application
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY > .env.local
          printf 'NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000\n' >> .env.local
          printf 'E2E_SEEDED_PASSWORD=DevPassword123!\n' >> .env.local
          cat .env.local >> "$GITHUB_ENV"
      - name: Seed local test data
        run: npm run seed
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          npm run lint
          npm run typecheck
          npm run test
      - name: Browser scenarios
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            J-cars-app/playwright-report/
            J-cars-app/test-results/
          if-no-files-found: ignore
          retention-days: 14
