name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Repo root holds J-cars-app as a subproject (alongside other, unrelated
# sibling projects) — every step runs from there.
#
# Playwright E2E isn't in this gate yet — Phase 0 has no specs (spec §17
# lands E2E coverage with the flows it tests, phase by phase).
defaults:
  run:
    working-directory: J-cars-app

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_DEFAULT_CURRENCY: ${{ vars.NEXT_PUBLIC_DEFAULT_CURRENCY }}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: "J-cars-app/.nvmrc"
          cache: "npm"
          cache-dependency-path: "J-cars-app/package-lock.json"

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
